<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>크루유니언 근태봇 · 관리자 페이지</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
:root{color-scheme:light;--bg:#f4f6fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;
  --brand:#4f46e5;--brand-soft:#eef2ff;--green:#16a34a;--green-soft:#dcfce7;--blue:#2563eb;--blue-soft:#dbeafe;
  --violet:#7c3aed;--violet-soft:#ede9fe;--amber:#d97706;--amber-soft:#fef3c7;--slate:#475569;--slate-soft:#f1f5f9;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px;}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
.brand{display:flex;align-items:center;gap:12px;}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;}
.brand h1{font-size:17px;margin:0;font-weight:700;}
.brand p{margin:0;color:var(--muted);font-size:12px;}
.conf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.conf input{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;}
.conf button{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;}
.badge-demo{font-size:11px;color:var(--amber);background:var(--amber-soft);padding:3px 9px;border-radius:999px;}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
.kpi .lab{color:var(--muted);font-size:12px;}
.kpi .val{font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:2px;}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px;}
.card h2{font-size:14px;margin:0 0 12px;font-weight:700;}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;}
table{width:100%;border-collapse:collapse;}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:13px;}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
tbody tr:last-child td{border-bottom:none;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;}
.b-work{background:var(--green-soft);color:#166534;}.b-remote{background:var(--blue-soft);color:#1e40af;}
.b-field{background:var(--violet-soft);color:#5b21b6;}.b-off{background:var(--amber-soft);color:#92400e;}
.b-none{background:var(--slate-soft);color:#334155;}
.chart-box{position:relative;height:230px;}
.appr{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:9px;}
.appr .t{font-weight:600;font-size:13px;}.appr .m{font-size:12px;color:var(--muted);margin-top:2px;}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--amber-soft);color:#92400e;}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:14px 0;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(24px);background:#111827;color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .25s,transform .25s;z-index:1000;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:#b91c1c;}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:900;padding:56px 16px;}
.modal-bg.show{display:flex;}
.modal{background:var(--card);border-radius:16px;padding:16px 18px;max-width:540px;width:100%;max-height:80vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.modal-head h2{margin:0;font-size:15px;font-weight:700;}
.modal-head .x{border:none;background:none;font-size:18px;cursor:pointer;color:var(--muted);line-height:1;}
.scroll-area{height:230px;overflow-y:auto;}  /* 월 통계 차트와 높이 맞춤(약 5행) */
.scroll-area thead th{position:sticky;top:0;background:var(--card);z-index:1;}
.more-btn{text-align:center;padding:9px;margin-top:8px;border:1px dashed var(--line);border-radius:9px;color:var(--brand);font-size:12px;cursor:pointer;font-weight:600;}
.more-btn:hover{background:var(--brand-soft);border-color:var(--brand);}
.kpi.click{cursor:pointer;transition:box-shadow .15s,border-color .15s;}
.kpi.click:hover{box-shadow:0 4px 14px rgba(79,70,229,.15);border-color:var(--brand);}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
@media(max-width:600px){
  .wrap{padding:14px 12px 48px;}
  .top{flex-direction:column;align-items:stretch;gap:10px;}
  .conf{width:100%;}
  .conf input{flex:1 1 auto;min-width:0;}
  .conf button{width:100%;}
  .brand h1{font-size:15px;}
  .kpis{grid-template-columns:1fr 1fr;gap:8px;}
  .kpi{padding:11px 12px;}.kpi .val{font-size:22px;}
  .card{padding:13px 13px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{min-width:440px;}
  th,td{padding:8px 6px;font-size:12px;}
}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo" style="background:#FDE006;padding:0;overflow:hidden">
        <svg viewBox="0 0 100 100" width="34" height="34" aria-label="크루유니언">
          <circle cx="52" cy="46" r="38" fill="#111"/>
          <path d="M30 78 L18 95 L46 80 Z" fill="#111"/>
          <path d="M40 33 L40 52 a12 12 0 0 0 24 0 L64 33" fill="none" stroke="#FDE006" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div><h1>크루유니언 근태봇 · 관리자 페이지</h1>
        <p>시스템관리자 전용 · <span id="mode"></span></p></div>
    </div>
    <div class="conf">
      <button onclick="openLeaveStats()" style="background:#fff;border:1px solid var(--brand);color:var(--brand)">휴가 통계</button>
      <button onclick="goToMe()" style="background:#fff;border:1px solid var(--brand);color:var(--brand)">근무일정 관리</button>
      <!-- API 주소·토큰은 매직 링크에서 자동 입력되므로 숨김(값은 JS가 사용) -->
      <input id="api" type="hidden">
      <input id="tok" type="hidden">
    </div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="lab">오늘 출근률</div><div class="val" id="k-rate">—</div><div class="sub" id="k-rate-sub">—</div></div>
    <div class="kpi"><div class="lab">재택근무</div><div class="val" id="k-remote">—</div><div class="sub">명</div></div>
    <div class="kpi"><div class="lab">외근</div><div class="val" id="k-field">—</div><div class="sub">명</div></div>
    <div class="kpi"><div class="lab">휴가</div><div class="val" id="k-off">—</div><div class="sub">명</div></div>
    <div class="kpi click" id="kpi-appr" onclick="openAppr()" title="클릭하면 승인 요청 목록"><div class="lab">승인 대기 <span style="font-size:1em">▷</span></div><div class="val" id="k-appr">—</div><div class="sub">건 · 클릭</div></div>
  </div>

  <!-- 실시간 근무현황: 전체폭 (인원 많을 때 좌우로 넓게) -->
  <div class="card">
    <h2>실시간 근무현황</h2>
    <div class="filters" id="sfilters">
      <span class="chip on" data-s="">전체</span>
      <span class="chip" data-s="work">근무중</span>
      <span class="chip" data-s="remote">재택</span>
      <span class="chip" data-s="field">외근</span>
      <span class="chip" data-s="off">휴가</span>
    </div>
    <table><thead><tr><th>직원</th><th>부서</th><th>상태</th></tr></thead><tbody id="live-body"></tbody></table>
    <div class="more-btn" id="live-more" onclick="toggleLive()" style="display:none"></div>
  </div>

  <!-- 월 근무 통계 · 직원별 통계: 좌우 나란히 -->
  <div class="g2">
    <div class="card">
      <h2>월 근무 통계 <span style="color:var(--muted);font-weight:400" id="mon-label"></span></h2>
      <div class="chart-box"><canvas id="chart"></canvas></div>
    </div>
    <div class="card">
      <h2>직원별 통계</h2>
      <div class="scroll-area">
        <table><thead><tr><th>직원</th><th>부서</th><th class="num">실근무</th><th class="num">연장</th><th class="num">야간</th><th class="num">휴일</th></tr></thead>
          <tbody id="emp-body"></tbody></table>
      </div>
    </div>
  </div>

  <!-- 휴가 통계 팝업 -->
  <div id="leaveStatsModal" class="modal-bg" onclick="if(event.target===this)closeLeaveStats()">
    <div class="modal" style="max-width:760px">
      <div class="modal-head"><h2>휴가 통계 (전체 구성원)</h2><button class="x" onclick="closeLeaveStats()">✕</button></div>
      <div id="ls-body"></div>
    </div>
  </div>

  <!-- 승인 요청: 상단 '승인 대기' KPI 클릭 시 팝업 -->
  <div id="apprModal" class="modal-bg" onclick="if(event.target===this)closeAppr()">
    <div class="modal">
      <div class="modal-head"><h2>승인 요청 (연장·휴일)</h2><button class="x" onclick="closeAppr()">✕</button></div>
      <div id="appr-list"></div>
    </div>
  </div>

  <div class="card">
    <h2>구성원 · 권한 관리</h2>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:10px;background:var(--slate-soft);border-radius:10px">
      <input id="add-slack" placeholder="Slack 이메일 또는 멤버 ID" style="border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12px;width:180px">
      <input id="add-name" placeholder="이름" style="border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12px;width:100px">
      <select id="add-dept" style="border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12px"></select>
      <select id="add-pos" style="border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12px"></select>
      <button class="chip" style="border-color:var(--brand);color:var(--brand)" onclick="addMember()">＋ 구성원 추가</button>
      <button class="chip" onclick="syncSlack()">⟳ Slack 이름 동기화</button>
    </div>
    <table>
      <thead><tr><th>이름</th><th>부서</th><th>직책 · 권한</th><th></th></tr></thead>
      <tbody id="role-body"></tbody>
    </table>
    <div id="role-msg" style="font-size:12px;margin-top:10px;min-height:16px;"></div>
  </div>
</div>

<script>
/* 통계 API에 연결. API/토큰 미입력 시 데모 데이터로 렌더. */
const $ = id => document.getElementById(id);
const H = m => (m==null?'—':(Math.floor(m/60)+'.'+Math.round((m%60)/6)));  // 분→시간(소수1)
let statusFilter = '', chart;
const MONTH = new Date().toISOString().slice(0,7);
window.goToMe=()=>{const base=$('api').value.trim()||location.origin; const tok=$('tok').value.trim();
  if(!tok){alert('먼저 토큰을 입력하고 불러오기 하세요.');return;}
  location.href=base+'/me?token='+encodeURIComponent(tok);};

const DEMO = {
  overview:{attendance_rate:92,present:8,eligible:9,remote:2,field:1,off:1,pending_approvals:3},
  monthly:{month:MONTH,worked:1028040/60,overtime:24840/60,night:1860/60,holiday:3120/60,records:210},
  live:{rows:[
    {employee_id:'K-2041',name:'홍길동',dept:'개발',status:'work'},
    {employee_id:'K-2044',name:'박민수',dept:'개발',status:'remote'},
    {employee_id:'K-3007',name:'최동욱',dept:'영업',status:'field'},
    {employee_id:'K-2050',name:'이영희',dept:'디자인',status:'off'}]},
  byemp:{rows:[
    {name:'홍길동',dept:'개발',worked:12540,overtime:360,night:120,holiday:0},
    {name:'김철수',dept:'개발',worked:13260,overtime:720,night:300,holiday:480}]},
  pending:{rows:[
    {id:1,employee:'김철수',dept:'개발',kind:'overtime',detail:'18:00~21:00 릴리스 대응'},
    {id:2,employee:'최동욱',dept:'영업',kind:'holiday',detail:'8/2(일) 전시회 지원'}]}
};

async function api(path){
  const base=$('api').value.trim(), tok=$('tok').value.trim();
  if(!base) throw new Error('demo');
  const r=await fetch(base+path,{headers: tok?{Authorization:'Bearer '+tok}:{}});
  if(!r.ok) throw new Error('http '+r.status);
  return r.json();
}

const SB={work:['근무중','b-work'],remote:['재택','b-remote'],field:['외근','b-field'],off:['휴가','b-off'],none:['미출근','b-none']};

function renderOverview(o){
  $('k-rate').textContent=o.attendance_rate+'%';
  $('k-rate-sub').textContent=(o.present??'-')+' / '+(o.eligible??'-')+'명';
  $('k-remote').textContent=o.remote; $('k-field').textContent=o.field;
  $('k-off').textContent=o.off;
  const ap=o.pending_approvals||0; $('k-appr').textContent=ap;
  const kc=$('kpi-appr'), red=ap>0;
  if(kc){ kc.style.borderColor=red?'#dc2626':''; kc.style.background=red?'#fef2f2':'';
    $('k-appr').style.color=red?'#dc2626':'';
    kc.querySelector('.lab').style.color=red?'#dc2626':'';
    kc.querySelector('.sub').style.color=red?'#dc2626':''; }
}
let liveExpanded=false; const LIVE_LIMIT=8;
function renderLive(rows){
  const f=rows.filter(r=>!statusFilter||r.status===statusFilter);
  const show=liveExpanded?f:f.slice(0,LIVE_LIMIT);
  $('live-body').innerHTML = show.length? show.map(r=>{
    const [lbl,cls]=SB[r.status]||SB.none;
    return `<tr><td>${r.name}</td><td>${r.dept}</td><td><span class="badge ${cls}">${lbl}</span></td></tr>`;
  }).join('') : '<tr><td colspan="3" class="empty">해당 상태의 직원이 없습니다</td></tr>';
  const more=$('live-more');
  if(more){ if(f.length>LIVE_LIMIT){ more.style.display='block'; more.textContent=liveExpanded?'▲ 접기':`▼ 전체 ${f.length}명 보기`; } else more.style.display='none'; }
}
window.toggleLive=()=>{ liveExpanded=!liveExpanded; renderLive(window._live||[]); };
window.openAppr=()=>{ $('apprModal').classList.add('show'); };
window.closeAppr=()=>{ $('apprModal').classList.remove('show'); };
window.closeLeaveStats=()=>{ $('leaveStatsModal').classList.remove('show'); };
window.openLeaveStats=async()=>{
  const base=$('api').value.trim(), tok=$('tok').value.trim();
  $('leaveStatsModal').classList.add('show');
  const el=$('ls-body'); el.innerHTML='<div class="empty">불러오는 중…</div>';
  try{
    const r=await fetch(base+'/api/leave-stats',{headers:{Authorization:'Bearer '+tok}});
    const j=await r.json();
    if(!r.ok){ el.innerHTML='<div class="empty">불러오기 실패: '+(j.detail||('HTTP '+r.status))+'</div>'; return; }
    const gs=j.groups||[];
    const head='<tr><th>구성원</th><th>부서</th>'+gs.map(g=>`<th class="num">${g.label}</th>`).join('')+'</tr>';
    const body=(j.rows||[]).map(row=>{
      const nm=row.name+(row.display_name&&row.display_name!==row.name?` <span style="color:var(--muted);font-size:11px">(${row.display_name})</span>`:'');
      const cells=gs.map(g=>{const b=row.balances[g.group];
        return b?`<td class="num"><b style="color:${b.remaining<0?'#dc2626':'#0369a1'}">${b.remaining}</b>/${b.granted} <span style="color:var(--muted);font-size:11px">(${b.used})</span></td>`:'<td class="num" style="color:var(--muted)">—</td>';}).join('');
      return `<tr><td>${nm}</td><td>${row.dept}</td>${cells}</tr>`;
    }).join('');
    el.innerHTML=`<div style="overflow-x:auto"><table><thead>${head}</thead><tbody>${body||'<tr><td class="empty" colspan="7">구성원이 없습니다</td></tr>'}</tbody></table></div>
      <div style="font-size:11px;color:var(--muted);margin-top:8px">셀 = 잔여/부여 (괄호=사용, 단위 일). 각자 휴가 관리에서 켜고 수량을 입력한 항목만 표시됩니다.</div>`;
  }catch(e){ el.innerHTML='<div class="empty">불러오기 실패: '+e+'</div>'; }
};
function renderMonthly(m){
  $('mon-label').textContent='· '+m.month;
  const data=[m.worked,m.overtime,m.night,m.holiday].map(x=>Math.round(x));
  const labels=['실근무','연장','야간','휴일'], colors=['#4f46e5','#f59e0b','#7c3aed','#dc2626'];
  if(chart) chart.destroy();
  chart=new Chart($('chart'),{type:'bar',data:{labels,datasets:[{data,backgroundColor:colors,borderRadius:8,maxBarThickness:60}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
      tooltip:{callbacks:{label:c=>c.parsed.y.toLocaleString()+' 시간'}}},
      scales:{y:{beginAtZero:true,grid:{color:'#eef0f4'}},x:{grid:{display:false}}}}});
}
function renderByEmp(rows){
  let html=rows.map(r=>`<tr><td>${r.name}</td><td>${r.dept}</td>
    <td class="num">${H(r.worked)}</td><td class="num">${H(r.overtime)}</td>
    <td class="num">${H(r.night)}</td><td class="num">${H(r.holiday)}</td></tr>`).join('');
  // 5행 미만이면 빈 행으로 채워 높이 유지(월 통계와 정렬)
  for(let i=rows.length;i<5;i++) html+='<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>';
  $('emp-body').innerHTML=html;
}
function renderPending(rows){
  $('appr-list').innerHTML = rows.length? rows.map(r=>`<div class="appr">
    <div style="display:flex;justify-content:space-between"><span class="t">${r.employee} · ${r.dept}</span>
    <span class="tag">${r.kind==='overtime'?'연장근무':'휴일근무'}</span></div>
    <div class="m">${r.detail}</div>
    <div style="display:flex;gap:6px;margin-top:8px">
      <button class="chip" style="border-color:var(--green);color:var(--green)" onclick="decideAppr(${r.id},'approve')">승인</button>
      <button class="chip" style="border-color:#dc2626;color:#dc2626" onclick="decideAppr(${r.id},'reject')">반려</button>
    </div></div>`).join('') : '<div class="empty">대기 중인 승인이 없습니다</div>';
}
window.decideAppr=async(id,decision)=>{
  const base=$('api').value.trim(), tok=$('tok').value.trim();
  if(!base||!tok){alert('API 주소와 토큰을 먼저 입력하세요.');return;}
  try{
    const r=await fetch(base+'/api/approvals/decide',{method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},
      body:JSON.stringify({id,decision})});
    const j=await r.json();
    if(!r.ok){alert('처리 실패: '+(j.detail||('HTTP '+r.status)));return;}
    reload();
  }catch(e){alert('오류: '+e);}
};

/* 하단에서 짧게 떴다 사라지는 토스트 */
function toast(m, isErr){const t=$('toast'); if(!t)return; t.textContent=m; t.classList.toggle('err',!!isErr); t.classList.add('show');
  clearTimeout(window._toastT); window._toastT=setTimeout(()=>t.classList.remove('show'), isErr?3200:1800);}

async function reload(){
  let demo=false, o,l,mo,be,pe;
  try{
    [o,l,mo,be,pe]=await Promise.all([
      api('/api/stats/overview'), api('/api/live'),
      api('/api/stats/monthly?month='+MONTH), api('/api/stats/by-employee?month='+MONTH),
      api('/api/approvals/pending')]);
    l=l.rows; be=be.rows; pe=pe.rows;
  }catch(e){
    if($('tok').value.trim()){  /* 토큰이 있는데 실패 = 인증/네트워크 오류 → 데모로 빠지지 않음 */
      $('mode').textContent='연결 오류 — Slack에서 다시 열어주세요'; $('mode').className='badge-demo';
      return;
    }
    demo=true; o=DEMO.overview; l=DEMO.live.rows; mo=DEMO.monthly; be=DEMO.byemp.rows; pe=DEMO.pending.rows; }
  $('mode').textContent = demo?'데모 데이터(미연결)':'API 연결됨';
  $('mode').className = demo?'badge-demo':'';
  window._live=l;
  renderOverview(o); renderLive(l); renderMonthly(mo); renderByEmp(be); renderPending(pe);
  if(demo){ renderRoles(DEMO_EMP, null); }
  else {
    try{ const emp=await api('/api/employees'); renderRoles(emp.rows, emp.me); }
    catch(e){ $('role-body').innerHTML='<tr><td colspan="4" class="empty">권한 관리는 인사담당자·시스템관리자만 볼 수 있습니다</td></tr>'; }
  }
}

const POSITIONS=['지회장','수석부지회장','사무장','부지회장','전임 스탭','조직부장','정책홍보부장','재무운영부장','대외협력부장'];
const DEPTS=['조직부','정책홍보부','재무운영부','대외협력부'];
const deptOpts=cur=>{const has=DEPTS.includes(cur);
  return `<option value="" ${has?'':'selected'} disabled hidden>부서</option>`+
    DEPTS.map(d=>`<option value="${d}" ${d===cur?'selected':''}>${d}</option>`).join('');};
const POS_ROLE={지회장:'sysadmin',수석부지회장:'sysadmin',사무장:'hr',부지회장:'employee','전임 스탭':'employee',조직부장:'employee',정책홍보부장:'employee',재무운영부장:'employee',대외협력부장:'employee'};
const ROLE_BADGE={sysadmin:['관리자','p-ok'],hr:['관리자(승인)','p-ok'],employee:['일반','p-cx']};
const DEMO_EMP=[
  {id:'K-3001',name:'김인사',dept:'경영지원',slack:'U3001',position:'사무장'},
  {id:'K-9001',name:'박부장',dept:'개발',slack:'U9001',position:'조직부장'},
  {id:'K-2041',name:'홍길동',dept:'개발',slack:'U2041',position:'전임 스탭'}];
function renderRoles(rows, me){
  $('role-body').innerHTML = rows.map(r=>{
    const pos=r.position||'전임 스탭';
    const opts=POSITIONS.map(p=>`<option value="${p}" ${p===pos?'selected':''}>${p}</option>`).join('');
    const [bl,bc]=ROLE_BADGE[POS_ROLE[pos]||'employee'];
    return `<tr>
      <td>${r.name}${r.display_name&&r.display_name!==r.name?` <span style="color:var(--muted);font-size:12px">(${r.display_name})</span>`:''}${r.slack===me?' <span style="color:var(--brand);font-size:11px">(나)</span>':''}</td>
      <td><select id="dept-${r.id}" style="padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px;background:#fff">${deptOpts(r.dept)}</select></td>
      <td><select id="pos-${r.id}" onchange="posBadge('${r.id}')" style="padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px;background:#fff">${opts}</select>
          <span class="pill ${bc}" id="posb-${r.id}" style="margin-left:6px">${bl}</span></td>
      <td><button class="chip" onclick="savePos('${r.id}')">저장</button> <button class="chip" onclick="inviteMember('${r.slack}','${r.name}')">초대</button>${r.slack!==me?` <button class="chip" style="border-color:#dc2626;color:#dc2626" onclick="delMember('${r.id}','${r.name}')">삭제</button>`:''}</td>
    </tr>`;
  }).join('');
  const sel=$('add-pos'); if(sel && !sel.options.length) sel.innerHTML='<option value="" selected disabled hidden>직책</option>'+POSITIONS.map(p=>`<option>${p}</option>`).join('');
  const dsel=$('add-dept'); if(dsel && !dsel.options.length) dsel.innerHTML='<option value="" selected disabled hidden>부서</option>'+DEPTS.map(d=>`<option>${d}</option>`).join('');
}
window.addMember=async()=>{
  const slack=$('add-slack').value.trim(), name=$('add-name').value.trim(), dept=$('add-dept').value.trim(), position=$('add-pos').value;
  const base=$('api').value.trim(), tok=$('tok').value.trim(), msg=$('role-msg');
  if(!slack){msg.style.color='#dc2626';msg.textContent='Slack ID는 필수입니다. (이름은 비우면 Slack Full name으로 등록)';return;}
  try{
    const r=await fetch(base+'/api/employees/add',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({slack,name,dept,position})});
    const j=await r.json();
    if(!r.ok){msg.style.color='#dc2626';msg.textContent='추가 실패: '+(j.detail||('HTTP '+r.status));return;}
    msg.textContent=''; toast((j.name||name)+' 추가 완료'+(j.invited?' · 초대 발송':' (초대 DM 실패)'));
    $('add-slack').value='';$('add-name').value='';$('add-dept').value='';
    reload();
  }catch(e){msg.style.color='#dc2626';msg.textContent='오류: '+e;}
};
window.inviteMember=async(slack,name)=>{
  const base=$('api').value.trim(), tok=$('tok').value.trim(), msg=$('role-msg');
  try{
    const r=await fetch(base+'/api/employees/invite',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({slack})});
    const j=await r.json();
    if(!r.ok){msg.style.color='#dc2626';msg.textContent='초대 실패: '+(j.detail||('HTTP '+r.status));return;}
    msg.textContent=''; toast(name+'님에게 초대 메시지를 보냈습니다.');
  }catch(e){msg.style.color='#dc2626';msg.textContent='오류: '+e;}
};
window.delMember=async(id,name)=>{
  if(!confirm(name+' 구성원을 삭제할까요? (근태 기록도 함께 삭제)'))return;
  const base=$('api').value.trim(), tok=$('tok').value.trim(), msg=$('role-msg');
  try{
    const r=await fetch(base+'/api/employees/delete',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({employee_id:id})});
    const j=await r.json();
    if(!r.ok){msg.style.color='#dc2626';msg.textContent='삭제 실패: '+(j.detail||('HTTP '+r.status));return;}
    msg.textContent=''; toast(name+' 삭제 완료'); reload();
  }catch(e){msg.style.color='#dc2626';msg.textContent='오류: '+e;}
};
window.posBadge=id=>{const p=$('pos-'+id).value;const [bl,bc]=ROLE_BADGE[POS_ROLE[p]||'employee'];const el=$('posb-'+id);el.textContent=bl;el.className='pill '+bc;};
window.savePos=async(id)=>{
  const position=$('pos-'+id).value, msg=$('role-msg');
  const dept=($('dept-'+id)?$('dept-'+id).value.trim():'');
  const base=$('api').value.trim(), tok=$('tok').value.trim();
  if(!base||!tok){ msg.style.color='#dc2626'; msg.textContent='API 주소와 토큰을 먼저 입력하세요.'; return; }
  const HDR={'Content-Type':'application/json',Authorization:'Bearer '+tok};
  try{
    const r=await fetch(base+'/api/employees/position',{method:'POST',headers:HDR,
      body:JSON.stringify({employee_id:id, position})});
    const j=await r.json();
    if(!r.ok){ msg.style.color='#dc2626'; msg.textContent='변경 실패: '+(j.detail||('HTTP '+r.status)); return; }
    // 부서도 함께 저장
    await fetch(base+'/api/employees/update',{method:'POST',headers:HDR,
      body:JSON.stringify({employee_id:id, dept})});
    msg.textContent=''; toast('저장했습니다.');
    reload();
  }catch(e){ toast('오류: '+e, true); }
};
window.syncSlack=async()=>{
  const base=$('api').value.trim(), tok=$('tok').value.trim(), msg=$('role-msg');
  if(!base||!tok){ msg.style.color='#dc2626'; msg.textContent='API 주소와 토큰을 먼저 입력하세요.'; return; }
  msg.style.color='var(--muted)'; msg.textContent='Slack 이름 동기화 중…';
  try{
    const r=await fetch(base+'/api/employees/refresh-slack',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok}});
    const j=await r.json();
    if(!r.ok){ msg.textContent=''; toast('동기화 실패: '+(j.detail||('HTTP '+r.status)), true); return; }
    msg.textContent=''; toast(j.updated+'명 Slack 이름 동기화 완료');
    reload();
  }catch(e){ toast('오류: '+e, true); }
};

$('sfilters').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c)return;
  document.querySelectorAll('#sfilters .chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); statusFilter=c.dataset.s; renderLive(window._live||[]);
});
/* 데모 서버(http://127.0.0.1:8000/)에서 열면 API 주소·토큰이 자동 입력됨 */
if(window.DEMO_API) $('api').value=window.DEMO_API;
if(window.DEMO_TOKEN) $('tok').value=window.DEMO_TOKEN;
/* 근태봇 '대시보드 가기' 매직 링크: ?token=... 이 있으면 자동 로그인 */
/* 토큰: 주소창(?token=) 또는 세션 저장소에서. 주소창에 있으면 세션에 저장 후 주소에서 감춤
   → 새로고침해도 세션에 남아 로그인 유지(데모 데이터로 빠지지 않음). */
const _urlTok=new URLSearchParams(location.search).get('token');
let _savedTok=''; try{ _savedTok=sessionStorage.getItem('sam_token')||''; }catch(e){}
const _tok=_urlTok||_savedTok;
if(_tok){ $('tok').value=_tok; if(!$('api').value) $('api').value=location.origin;
  try{ sessionStorage.setItem('sam_token',_tok); }catch(e){}
  if(_urlTok){ try{ history.replaceState(null,'',location.pathname); }catch(e){} } }
reload();
</script>
