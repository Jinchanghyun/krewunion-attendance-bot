<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>크루유니언 근태봇 · 내 근태</title>
<style>
:root{color-scheme:light;--bg:#f4f6fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;
  --brand:#4f46e5;--brand-soft:#eef2ff;--green:#16a34a;--green-soft:#dcfce7;--blue:#2563eb;--blue-soft:#dbeafe;
  --violet:#7c3aed;--violet-soft:#ede9fe;--amber:#d97706;--amber-soft:#fef3c7;--red:#dc2626;--red-soft:#fee2e2;--slate:#475569;--slate-soft:#f1f5f9;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;}
.wrap{max-width:960px;margin:0 auto;padding:18px 18px 70px;}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.who{display:flex;align-items:center;gap:11px;}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;}
.who h1{font-size:16px;margin:0;font-weight:700;}
.who p{margin:0;color:var(--muted);font-size:12px;}
.modes{display:flex;gap:6px;align-items:center;}
.mode{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;color:var(--muted);cursor:pointer;text-decoration:none;}
.mode.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:9px 14px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;}
.tab.on{color:var(--brand);border-color:var(--brand);font-weight:600;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px;}
.card h2{font-size:14px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.mnav{display:flex;align-items:center;gap:8px;}
.mnav button{border:1px solid var(--line);background:#fff;border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:14px;}
.mnav .lbl{font-weight:700;font-size:14px;min-width:96px;text-align:center;}
.hidden{display:none;}
/* summary */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.sum .b{background:var(--slate-soft);border-radius:10px;padding:10px 12px;}
.sum .l{font-size:11px;color:var(--muted);}.sum .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}
/* calendar */
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.dow span{text-align:center;font-size:11px;color:var(--muted);padding:3px 0;}
.cell{min-height:64px;border:1px solid var(--line);border-radius:9px;padding:5px 6px;font-size:11px;position:relative;background:#fff;}
.cell.mut{background:#fafafa;color:#cbd0d8;}
.cell .dn{font-weight:600;font-size:11px;}
.cell.today .dn{color:var(--brand);}
.cell.off{background:var(--green-soft);}
.badge{display:inline-block;font-size:10px;font-weight:700;border-radius:5px;padding:1px 5px;margin-top:3px;}
.bg-work{background:var(--green-soft);color:#166534;}.bg-remote{background:var(--blue-soft);color:#1e40af;}
.bg-field{background:var(--violet-soft);color:#5b21b6;}.bg-off{background:var(--amber-soft);color:#92400e;}
.bg-nol{background:#dcfce7;color:#166534;}.bg-short{background:var(--amber-soft);color:#92400e;}
.tt{font-size:10px;color:var(--muted);margin-top:2px;}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted);}
.lg{display:inline-flex;align-items:center;gap:4px;}.sw{width:10px;height:10px;border-radius:3px;}
/* table */
table{width:100%;border-collapse:collapse;}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:13px;}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
tbody tr:last-child td{border-bottom:none;}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;}
.p-req{background:var(--amber-soft);color:#92400e;}.p-ok{background:var(--green-soft);color:#166534;}
.p-no{background:var(--red-soft);color:#991b1b;}.p-cx{background:var(--slate-soft);color:#475569;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.seg span{padding:5px 12px;font-size:12px;color:var(--muted);cursor:pointer;}
.seg span.on{background:var(--brand);color:#fff;}
label.fl{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:600;}
.field{margin-bottom:12px;}
select,input[type=time],input[type=date],input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;font-family:inherit;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{border:none;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
.btn-p{background:var(--brand);color:#fff;}.btn-g{background:#fff;border:1px solid var(--line);color:var(--muted);}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:16px 0;}
.linkbtn{color:var(--brand);font-size:13px;text-decoration:none;font-weight:600;}
@media(max-width:640px){.sum{grid-template-columns:repeat(2,1fr)}.cell{min-height:52px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="who"><div><h1 id="nm">내 근태</h1><p id="sub">—</p></div></div>
    <div class="modes">
      <span class="mode on">근무일정 관리</span>
      <a class="mode hidden" id="adminlink">관리 대시보드</a>
    </div>
  </div>

  <div class="tabs">
    <span class="tab on" data-t="cal">근무시스템</span>
    <span class="tab" data-t="rec">출퇴근 기록</span>
    <span class="tab" data-t="sch">근무일정</span>
    <span class="tab" data-t="lv">휴가 신청</span>
    <span class="tab" data-t="lvcfg">휴가 관리</span>
    <span class="tab" data-t="ot">시간외근무</span>
  </div>

  <div class="mnav card" style="display:flex;align-items:center;justify-content:center;padding:10px">
    <button onclick="moveMonth(-1)">‹</button>
    <span class="lbl" id="mlabel">—</span>
    <button onclick="moveMonth(1)">›</button>
  </div>

  <!-- 근태 캘린더 -->
  <div id="tab-cal">
    <div class="card">
      <div id="wt-panel"></div>
      <div class="sum" id="summary"></div>
      <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="days" id="calgrid"></div>
      <div class="legend">
        <span class="lg"><span class="sw bg-work"></span>출근</span>
        <span class="lg"><span class="sw bg-remote"></span>재택</span>
        <span class="lg"><span class="sw bg-field"></span>외근</span>
        <span class="lg"><span class="sw bg-off"></span>휴가/반차</span>
        <span class="lg"><span class="sw" style="background:#dcfce7"></span>놀금</span>
        <span class="lg"><span class="sw bg-short"></span>단축</span>
      </div>
    </div>
  </div>

  <!-- 출퇴근 기록 -->
  <div id="tab-rec" class="hidden">
    <div class="card">
      <h2>출퇴근 기록 관리
        <span class="seg" id="recview"><span class="on" data-v="list">목록형</span><span data-v="cal">달력형</span></span>
      </h2>
      <div id="rec-list"><table><thead><tr><th>날짜</th><th>형태</th><th>출근</th><th>퇴근</th><th class="num">실근무</th><th class="num">연장</th></tr></thead><tbody id="rec-body"></tbody></table></div>
      <div id="rec-cal" class="hidden"><div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="days" id="reccalgrid"></div></div>
    </div>
  </div>

  <!-- 근무일정 -->
  <div id="tab-sch" class="hidden">
    <div class="card">
      <h2>근무일정 · 근무제도 <a class="linkbtn" id="editcfg" href="#">근무 설정 편집 →</a></h2>
      <div id="sch-body"></div>
    </div>
  </div>

  <!-- 연차 -->
  <div id="tab-lv" class="hidden">
    <div class="card">
      <h2>휴가 신청 <span style="font-weight:400;color:var(--muted);font-size:12px">· 승인 없이 즉시 반영</span></h2>
      <div id="lv-balances"></div>
      <div class="row3">
        <div class="field"><label class="fl">종류</label><select id="lv-kind">
          <optgroup label="연차">
            <option value="annual">연차 (종일)</option>
            <option value="half_am">오전 반차</option>
            <option value="half_pm">오후 반차</option>
          </optgroup>
          <optgroup label="특수 휴가 (연차 미차감)">
            <option value="sabbatical">안식휴가</option>
            <option value="family_care">가족돌봄 휴가</option>
            <option value="bd">BD</option>
            <option value="health">건강휴가</option>
            <option value="health_check_full">건강검진 (8h)</option>
            <option value="health_check_am">건강검진 (오전 4h)</option>
            <option value="health_check_pm">건강검진 (오후 4h)</option>
            <option value="birthday_full">생일 (8h)</option>
            <option value="birthday_am">생일 (오전 4h)</option>
            <option value="birthday_pm">생일 (오후 4h)</option>
          </optgroup>
        </select></div>
        <div class="field"><label class="fl">시작일</label><input type="date" id="lv-start"></div>
        <div class="field"><label class="fl" id="lv-endlabel">종료일</label><input type="date" id="lv-end"></div>
      </div>
      <div class="field"><label class="fl">사유 <span style="color:var(--muted);font-weight:400">(선택)</span></label><input type="text" id="lv-reason" placeholder=""></div>
      <button class="btn btn-p" id="lv-submit" style="margin-top:10px">연차 신청</button>
      <div id="lv-msg" style="font-size:12px;margin-top:8px;min-height:14px"></div>
    </div>
    <div class="card">
      <h2>내 연차 내역</h2>
      <table><thead><tr><th>종류</th><th>기간</th><th class="num">일수</th><th>사유</th><th></th></tr></thead><tbody id="lv-body"></tbody></table>
    </div>
  </div>

  <!-- 휴가 관리(개인 부여 설정) -->
  <div id="tab-lvcfg" class="hidden">
    <div class="card">
      <h2>휴가 관리 <span style="font-weight:400;color:var(--muted);font-size:12px">· 사용할 휴가를 켜고 당해년도 사용가능 수량을 직접 입력하세요. 켠 항목만 신청 화면에 나옵니다.</span></h2>
      <div id="lvcfg-body"></div>
      <button class="btn btn-p" id="lvcfg-save" style="margin-top:12px">저장</button>
      <div id="lvcfg-msg" style="font-size:12px;margin-top:8px;min-height:14px"></div>
    </div>
  </div>

  <!-- 시간외근무 -->
  <div id="tab-ot" class="hidden">
    <div class="card">
      <h2>시간외근무 신청</h2>
      <div class="row3">
        <div class="field"><label class="fl">종류</label><select id="ot-kind"><option value="overtime">연장근무</option><option value="holiday">휴일근무</option></select></div>
        <div class="field"><label class="fl">일자</label><input type="date" id="ot-date"></div>
        <div class="field"><label class="fl">사유</label><input type="text" id="ot-detail" placeholder=""></div>
      </div>
      <div class="row2">
        <div class="field"><label class="fl">시작</label><input type="time" id="ot-start" value="18:00"></div>
        <div class="field"><label class="fl">종료</label><input type="time" id="ot-end" value="21:00"></div>
      </div>
      <button class="btn btn-p" id="ot-submit">승인 요청</button>
      <div id="ot-msg" style="font-size:12px;margin-top:8px;min-height:14px"></div>
    </div>
    <div class="card">
      <h2>내 신청 내역</h2>
      <table><thead><tr><th>종류</th><th>내용</th><th>상태</th><th></th></tr></thead><tbody id="ot-body"></tbody></table>
    </div>
  </div>

  <div id="err" class="card" style="display:none;color:#dc2626;font-size:13px"></div>
</div>

<!-- 출퇴근 편집 팝업 -->
<div id="edit-modal" style="position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:900;padding:50px 16px" onclick="if(event.target===this)closeEdit()">
  <div style="background:#fff;border-radius:16px;padding:18px 20px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><b id="edit-title">출퇴근 편집</b><button onclick="closeEdit()" style="border:none;background:none;font-size:18px;cursor:pointer;color:var(--muted)">✕</button></div>
    <div class="field" style="margin-bottom:8px"><label class="fl">형태</label><select id="ed-kind"><option value="office">사무실</option><option value="remote">재택</option><option value="field">외근</option><option value="dayoff">데이오프 (근무 안 함)</option></select></div>
    <div class="row2">
      <div class="field"><label class="fl">출근</label><input type="time" id="ed-in" step="1800"></div>
      <div class="field"><label class="fl">퇴근</label><input type="time" id="ed-out" step="1800"></div>
    </div>
    <div class="field" style="margin-top:8px"><label class="fl">자리비움 (30분 단위)</label><select id="ed-away"></select></div>
    <button class="btn btn-p" id="ed-save" style="margin-top:14px;width:100%">저장</button>
    <div id="ed-msg" style="font-size:12px;margin-top:8px;min-height:14px"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const API=window.SAM_API||location.origin;
const _urlTok=new URLSearchParams(location.search).get('token')||'';
let _savedTok=''; try{_savedTok=sessionStorage.getItem('sam_token')||'';}catch(e){}
const TOKEN=_urlTok||_savedTok;
if(TOKEN){ try{sessionStorage.setItem('sam_token',TOKEN);}catch(e){}
  if(_urlTok){try{history.replaceState(null,'',location.pathname);}catch(e){}} }  /* 세션 저장 + 주소창 감춤 */
const H=m=>(m?(Math.floor(m/60)+'시간 '+String(m%60).padStart(2,'0')+'분'):'—');
const Hh=m=>(m?(Math.round(m/6)/10):0);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=new Date();
let cur=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
let DATA=null, CFG=null;

async function api(path,opts){const r=await fetch(API+path,Object.assign({headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN}},opts||{}));if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
function showErr(m){$('err').style.display='block';$('err').textContent=m;}

async function boot(){
  if(!TOKEN){showErr('토큰이 없습니다. Slack 근태봇 홈 탭의 "내 통계" 버튼으로 들어와 주세요.');return;}
  try{
    const me=await api('/api/my/summary');
    $('nm').textContent=me.name;
    const WT={normal:'일반근무',flex:'시차근무',selective:'선택적근무',elastic:'탄력근무'}[me.work_type]||me.work_type;
    $('sub').textContent=me.dept+' · '+WT;
    $('editcfg').href=API+'/settings?token='+TOKEN;
    if(me.role==='hr'||me.role==='sysadmin'){const a=$('adminlink');a.classList.remove('hidden');a.href=API+'/?token='+TOKEN;}
    await loadMonth();
    loadLeaveConfig();   // 휴가 신청 드롭다운을 개인 설정대로 준비
  }catch(e){showErr('불러오기 실패: '+e+' (링크가 만료됐으면 Slack에서 다시 열어주세요)');}
}

async function loadMonth(){
  const m=iso(cur).slice(0,7);
  $('mlabel').textContent=cur.getFullYear()+'년 '+(cur.getMonth()+1)+'월';
  DATA=await api('/api/my/month?month='+m); CFG=DATA.config;
  renderWorktime(); renderSummary(); renderCalendar($('calgrid')); renderCalendar($('reccalgrid')); renderRecList(); renderSchedule();
}
function moveMonth(d){cur=new Date(cur.getFullYear(),cur.getMonth()+d,1);loadMonth();}

/* 놀금·단축 계산 */
function lastFri(y,m){const d=new Date(y,m+1,0);while(d.getDay()!==5)d.setDate(d.getDate()-1);return d;}
function isNol(date){const rc=(CFG&&CFG.recovery)||{};if(rc.mode==='lastfri')return iso(lastFri(date.getFullYear(),date.getMonth()))===iso(date);
  if(rc.mode==='thirdfri')return date.getDay()===5 && Math.floor((date.getDate()-1)/7)===2;
  if(rc.mode==='biweekly'){if(!rc.anchor||date.getDay()!==5)return false;const diff=Math.round((date-new Date(rc.anchor+'T00:00'))/86400000);return diff>=0&&diff%14===0;}
  if(rc.mode==='custom')return (rc.custom||[]).includes(iso(date));return false;}
function isShort(date){if(!CFG||!(CFG.short_rules||[]).length)return false;const wd=date.getDay();if(wd<1||wd>5)return false;const t=iso(date);
  return CFG.short_rules.some(r=>{if(r.repeat==='dates')return (r.dates||[]).includes(t);if(r.start&&t<r.start)return false;if(r.end&&t>r.end)return false;if(r.repeat==='weekly')return (r.weekdays||[]).includes(wd);return true;});}

function maps(){const rec={},lv={};(DATA.records||[]).forEach(r=>rec[r.date]=r);
  (DATA.leaves||[]).forEach(l=>{let d=new Date(l.start+'T00:00'),e=new Date(l.end+'T00:00');for(;d<=e;d.setDate(d.getDate()+1))lv[iso(d)]=l.kind;});
  return {rec,lv};}
const TYPE={office:['출','bg-work'],remote:['재','bg-remote'],field:['외','bg-field'],dayoff:['데이오프','bg-off']};
const LV={annual:['연차','bg-off'],half_am:['오전반차','bg-off'],half_pm:['오후반차','bg-off'],
  sabbatical:['안식휴가','bg-off'],family_care:['가족돌봄','bg-off'],family_care_paid:['가족돌봄(유급)','bg-off'],family_care_unpaid:['가족돌봄(무급)','bg-off'],refresh:['리프레쉬','bg-off'],bd:['BD','bg-off'],
  seollal:['설날','bg-off'],chuseok:['추석','bg-off'],health:['건강휴가','bg-off'],
  health_check_am:['검진(오전)','bg-off'],health_check_pm:['검진(오후)','bg-off'],health_check_full:['건강검진','bg-off'],
  birthday_am:['생일(오전)','bg-off'],birthday_pm:['생일(오후)','bg-off'],birthday_full:['생일','bg-off']};

const WTN={normal:'일반근무',flex:'시차근무',selective:'선택적근무',elastic:'탄력근무'};
function renderWorktime(){const w=DATA.worktime;const el=$('wt-panel');if(!el)return;
  if(!w){el.innerHTML='';return;}
  const box=(l,v,c)=>`<div style="flex:1;min-width:78px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:9px 11px"><div style="font-size:11px;color:var(--muted)">${l}</div><div style="font-size:15px;font-weight:700;margin-top:2px;${c||''}">${v}</div></div>`;
  const hh=m=>Hh(m)+'h';
  const ot=w.overtime_min?hh(w.overtime_min)+(w.overtime_capped?' <span style="font-size:10px">(최대)</span>':''):'0h';
  let pend='';
  if((w.pending_ot_min||0)>0){const amt=hh(w.pending_ot_min);
    if(w.can_request_ot) pend=`<div style="margin-bottom:8px"><button class="btn btn-p" style="padding:7px 14px" onclick="requestMonthOT()">연장근로 ${amt} 승인 요청</button></div>`;
    else pend=`<div style="font-size:12px;color:#b45309;margin-bottom:8px">연장근로 미승인 ${amt}${w.ot_window_note?(' · '+w.ot_window_note):''}</div>`;
  }
  el.innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
    ${box('근무제도',WTN[w.work_type]||w.work_type)}
    ${box('월 소정근로 / 실근로',hh(w.scheduled_min)+' / '+hh(w.actual_min))}
    ${box('휴가 사용',hh(w.leave_min))}
    ${box('연장근로(승인)',ot,w.overtime_min?'color:#dc2626':'')}
  </div>${pend}`;
}
window.requestMonthOT=async()=>{const m=iso(cur).slice(0,7);
  try{const r=await api('/api/my/overtime/request-month',{method:'POST',body:JSON.stringify({month:m})});
    alert(r.hours+'시간 연장근로 승인 요청을 보냈습니다. 사무장 승인 후 반영됩니다.');loadMonth();
  }catch(e){alert('신청 실패: '+e);}};
function renderSummary(){const s=DATA.summary;$('summary').innerHTML=
  [['실근무',s.worked],['연장',s.overtime],['야간',s.night],['휴일',s.holiday]]
  .map(([l,v])=>`<div class="b"><div class="l">${l}</div><div class="v">${Hh(v)}<span style="font-size:12px;color:var(--muted)">h</span></div></div>`).join('');}

/* 달력 날짜 클릭 → 출퇴근 편집 팝업 */
let editDate=null;
window.closeEdit=()=>{$('edit-modal').style.display='none';};
function openEditDay(ds){editDate=ds;const {rec}=maps();const r=rec[ds];
  $('edit-title').textContent=ds+' 출퇴근 편집';
  $('ed-kind').value=(r&&r.type)||'office';
  $('ed-in').value=(r&&r.checkin)||(CFG&&CFG.checkin)||'09:00';
  $('ed-out').value=(r&&r.checkout)||(CFG&&CFG.checkout)||'18:00';
  if(!$('ed-away').options.length){let o='';for(let mm=0;mm<=480;mm+=30){const lab=mm===0?'없음':(mm>=60?(Math.floor(mm/60)+'시간'+(mm%60?' 30분':'')):'30분');o+=`<option value="${mm}">${lab}</option>`;}$('ed-away').innerHTML=o;}
  $('ed-away').value='0';$('ed-msg').textContent='';
  $('edit-modal').style.display='flex';}
document.getElementById('calgrid').addEventListener('click',e=>{const c=e.target.closest('[data-d]');if(c)openEditDay(c.dataset.d);});
document.getElementById('ed-kind').addEventListener('change',()=>{const off=$('ed-kind').value==='dayoff';['ed-in','ed-out','ed-away'].forEach(id=>{$(id).disabled=off;$(id).style.opacity=off?.4:1;});});
document.getElementById('ed-save').addEventListener('click',async()=>{const msg=$('ed-msg');
  const ci=$('ed-in').value,co=$('ed-out').value;
  if(!ci){msg.style.color='#dc2626';msg.textContent='출근 시간을 입력하세요.';return;}
  try{await api('/api/my/attendance/edit',{method:'POST',body:JSON.stringify({date:editDate,kind:$('ed-kind').value,checkin:ci,checkout:co||null,away_min:+$('ed-away').value})});
    closeEdit();loadMonth();
  }catch(e){msg.style.color='#dc2626';msg.textContent='저장 실패: '+e;}});

function renderCalendar(grid){const y=cur.getFullYear(),m=cur.getMonth();const start=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();const {rec,lv}=maps();
  const W=DATA.worktime;const FULFILLED=W&&W.work_type==='selective'&&W.scheduled_min>0&&W.actual_min>=W.scheduled_min;
  let cells='';for(let i=0;i<start;i++)cells+='<div class="cell mut"></div>';
  for(let dd=1;dd<=dim;dd++){const date=new Date(y,m,dd),k=iso(date);let cls='cell',inner=`<div class="dn">${dd}</div>`;
    if(date.getDay()===0)cls+='';
    if(lv[k]){const [lb,c]=LV[lv[k]]||['휴가','bg-off'];inner+=`<div class="badge ${c}">${lb}</div>`;}
    else if(isNol(date)){cls+=' off';inner+=`<div class="badge bg-nol">놀금</div>`;}
    else if(rec[k]){const [lb,c]=TYPE[rec[k].type]||['출','bg-work'];inner+=`<div class="badge ${c}">${lb} ${rec[k].checkin||''}</div>`;
      if(rec[k].checkout)inner+=`<div class="tt">~${rec[k].checkout}</div>`;
      if(isShort(date))inner+=`<div class="badge bg-short">단축</div>`;}
    else if(FULFILLED && date.getDay()>=1 && date.getDay()<=5 && k>=iso(TODAY)){
      inner+=`<div class="badge bg-off" title="소정근로 충족 — 데이오프">데이오프</div>`;}
    else if(isShort(date))inner+=`<div class="badge bg-short">단축</div>`;
    if(iso(date)===iso(TODAY))cls+=' today';
    cells+=`<div class="${cls}" data-d="${k}" style="cursor:pointer">${inner}</div>`;}
  grid.innerHTML=cells;}

function renderRecList(){const rows=(DATA.records||[]);$('rec-body').innerHTML=rows.length?rows.map(r=>{
  const [lb]=TYPE[r.type]||['출'];const tn={office:'사무실',remote:'재택',field:'외근',dayoff:'데이오프'}[r.type]||r.type;
  return `<tr><td>${r.date}</td><td>${tn}</td><td>${r.checkin||'—'}</td><td>${r.checkout||'—'}</td><td class="num">${H(r.work)}</td><td class="num">${r.overtime?H(r.overtime):'—'}</td></tr>`;
}).join(''):'<tr><td colspan="6" class="empty">이 달 출퇴근 기록이 없습니다</td></tr>';}

function renderSchedule(){const c=CFG||{};const WT={normal:'일반근무',flex:'시차근무',selective:'선택적근무',elastic:'탄력근무'}[c.work_type]||c.work_type;
  const rc=c.recovery||{};const nol={none:'사용 안 함',lastfri:'매월 마지막 주 금요일',thirdfri:'매월 셋째 주 금요일',biweekly:'격주 금요일'+(rc.anchor?' (기준 '+rc.anchor+')':''),custom:'직접 지정('+((rc.custom||[]).length)+'일)'}[rc.mode]||'—';
  const rules=(c.short_rules||[]);
  const rulesHtml=rules.length?rules.map(r=>{const kind=r.kind==='late'?'출근 늦춤':'퇴근 당김';const amt=r.amount_min>=60?(r.amount_min/60)+'시간':r.amount_min+'분';
    let when=r.repeat==='weekly'?('매주 '+(r.weekdays||[]).map(d=>({1:'월',2:'화',3:'수',4:'목',5:'금'}[d])).join('·')):(r.repeat==='dates'?(r.dates||[]).length+'일 지정':'매일(월–금)');
    return `<div class="pill p-cx" style="margin:2px 4px 2px 0;display:inline-block">${kind} · ${amt} · ${when}</div>`;}).join(''):'<span style="color:var(--muted);font-size:12px">등록된 단축근무 없음</span>';
  $('sch-body').innerHTML=`
    <table style="margin-bottom:8px">
      <tr><td style="color:var(--muted);width:120px">근무제도</td><td>${WT}</td></tr>
      <tr><td style="color:var(--muted)">기본 출퇴근</td><td>${c.checkin||'09:00'} ~ ${c.checkout||'18:00'} (휴게 ${c.break_start||'12:00'}~${c.break_end||'13:00'})</td></tr>
      <tr><td style="color:var(--muted)">놀금(리커버리데이)</td><td>${nol}</td></tr>
    </table>
    <div style="font-size:12px;color:var(--muted);margin-bottom:6px">단축근무 규칙</div>
    <div>${rulesHtml}</div>`;}

/* 시간외근무 */
async function loadOvertime(){try{const d=await api('/api/my/overtime');const P={requested:['대기','p-req'],approved:['승인','p-ok'],rejected:['반려','p-no'],cancelled:['취소','p-cx']};
  $('ot-body').innerHTML=d.rows.length?d.rows.map(r=>{const [lb,c]=P[r.status]||['',''];const kn=r.kind==='overtime'?'연장':'휴일';
    const cancel=r.status==='requested'?`<button class="btn btn-g" style="padding:4px 10px" onclick="cancelOt(${r.id})">취소</button>`:'';
    return `<tr><td>${kn}</td><td>${r.detail||''}</td><td><span class="pill ${c}">${lb}</span></td><td>${cancel}</td></tr>`;}).join(''):'<tr><td colspan="4" class="empty">신청 내역이 없습니다</td></tr>';
}catch(e){$('ot-body').innerHTML='<tr><td colspan="4" class="empty">불러오기 실패</td></tr>';}}
window.cancelOt=async(id)=>{try{await api('/api/my/overtime/cancel',{method:'POST',body:JSON.stringify({id})});loadOvertime();}catch(e){alert('취소 실패: '+e);}};
$('ot-submit').addEventListener('click',async()=>{const msg=$('ot-msg');
  const kind=$('ot-kind').value,date=$('ot-date').value,st=$('ot-start').value,en=$('ot-end').value,rs=$('ot-detail').value;
  if(!date){msg.style.color='#dc2626';msg.textContent='일자를 선택하세요.';return;}
  const detail=`${date} ${st}~${en}`+(rs?(' · '+rs):'');
  try{await api('/api/my/overtime',{method:'POST',body:JSON.stringify({kind,date,start:st,end:en,detail})});
    msg.style.color='var(--green)';msg.textContent='승인 요청을 보냈습니다. 팀장 승인 후 반영됩니다.';loadOvertime();
  }catch(e){msg.style.color='#dc2626';msg.textContent='신청 실패: '+e;}});

/* 휴가 */
const SINGLE_LV=['half_am','half_pm','health_check_am','health_check_pm','birthday_am','birthday_pm'];
async function loadLeave(){try{const d=await api('/api/my/leave');const P={applied:['확정','p-ok'],cancelled:['취소','p-cx']};
  const bals=d.balances||[];const lb=$('lv-balances');
  if(lb)lb.innerHTML=bals.length?'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'+bals.map(b=>`<div style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:9px;padding:7px 11px;font-size:12px"><b>${b.label}</b> 잔여 <b style="color:#0369a1">${b.remaining}</b>/${b.granted}일 <span style="color:var(--muted)">(사용 ${b.used})</span></div>`).join('')+'</div>':'';
  $('lv-body').innerHTML=d.rows.length?d.rows.map(r=>{const [lb,c]=P[r.status]||['확정','p-ok'];
    const per=r.start===r.end?r.start:(r.start+' ~ '+r.end);
    const cancel=r.status==='applied'?`<button class="btn btn-g" style="padding:4px 10px" onclick="cancelLeave(${r.id})">취소</button>`:'';
    return `<tr><td>${r.kind_label||r.kind}</td><td>${per}</td><td class="num">${r.days||'—'}</td><td>${r.reason||'—'}</td><td>${cancel}</td></tr>`;}).join(''):'<tr><td colspan="5" class="empty">신청 내역이 없습니다</td></tr>';
}catch(e){$('lv-body').innerHTML='<tr><td colspan="5" class="empty">불러오기 실패</td></tr>';}}
window.cancelLeave=async(id)=>{if(!confirm('이 휴가를 취소할까요?'))return;
  try{await api('/api/my/leave/cancel',{method:'POST',body:JSON.stringify({id})});loadLeave();loadMonth();}catch(e){alert('취소 실패: '+e);}};
$('lv-kind').addEventListener('change',()=>{const single=SINGLE_LV.includes($('lv-kind').value);$('lv-end').disabled=single;$('lv-endlabel').style.opacity=single?.4:1;if(single)$('lv-end').value=$('lv-start').value;});
$('lv-start').addEventListener('change',()=>{if(SINGLE_LV.includes($('lv-kind').value))$('lv-end').value=$('lv-start').value;});
$('lv-submit').addEventListener('click',async()=>{const msg=$('lv-msg');
  const kind=$('lv-kind').value,start=$('lv-start').value,reason=$('lv-reason').value.trim();
  let end=$('lv-end').value; if(SINGLE_LV.includes(kind))end=start;
  if(!start){msg.style.color='#dc2626';msg.textContent='시작일을 선택하세요.';return;}
  try{const r=await api('/api/my/leave',{method:'POST',body:JSON.stringify({kind,start,end,reason})});
    msg.style.color='var(--green)';msg.textContent=(r.days>0?`${r.days}일 차감 · `:'')+'신청 완료 (즉시 반영)';
    $('lv-reason').value='';loadLeave();loadMonth();
  }catch(e){msg.style.color='#dc2626';msg.textContent='신청 실패: '+e;}});

/* 휴가 관리(개인 부여 설정) */
const NI='style="width:58px;padding:4px 6px;border:1px solid var(--line);border-radius:6px"';
const SI='style="padding:4px 6px;border:1px solid var(--line);border-radius:6px"';
const LV_TYPES=[
  {key:'annual',name:'연차',fields:['quota'],unit:'일'},
  {key:'bd',name:'BD',fields:['bd']},
  {key:'seollal',name:'설날 휴가',fields:['hours']},
  {key:'chuseok',name:'추석 휴가',fields:['hours']},
  {key:'family_care',name:'가족돌봄 휴가',fields:['paid','quota'],unit:'일'},
  {key:'birthday',name:'생일 휴가',fields:['hours']},
  {key:'health',name:'건강휴가',fields:['quota'],unit:'일'},
  {key:'sabbatical',name:'안식휴가',fields:['quota'],unit:'일'},
  {key:'refresh',name:'리프레쉬 휴가',fields:['quota'],unit:'일'},
  {key:'health_check',name:'건강검진',fields:['hours']},
];
let LV_CFG={};
function lvcfgRender(cfg){$('lvcfg-body').innerHTML=LV_TYPES.map(t=>{const c=cfg[t.key]||{};const on=t.key==='annual'?(c.on!==false):!!c.on;let inp='';
  if(t.fields.includes('bd'))inp+=`<span><input type="number" min="1" id="lc-${t.key}-cycle" value="${c.cycle??2}" ${NI}>주마다 <input type="number" min="0" id="lc-${t.key}-hours" value="${c.hours??4}" ${NI}>시간</span>`;
  if(t.fields.includes('hours'))inp+=`<span><select id="lc-${t.key}-hours" ${SI}><option value="4" ${c.hours==4?'selected':''}>4시간</option><option value="8" ${(c.hours==8||c.hours==null)?'selected':''}>8시간</option></select></span>`;
  if(t.fields.includes('paid'))inp+=`<span><select id="lc-${t.key}-paid" ${SI}><option ${c.paid!=='무급'?'selected':''}>유급</option><option ${c.paid==='무급'?'selected':''}>무급</option></select></span>`;
  if(t.fields.includes('quota'))inp+=`<span>연 <input type="number" min="0" step="0.5" id="lc-${t.key}-quota" value="${c.quota??''}" placeholder="0" ${NI}> ${t.unit||''}</span>`;
  return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap"><input type="checkbox" id="lc-${t.key}-on" ${on?'checked':''} style="width:16px;height:16px"><b style="min-width:104px">${t.name}</b><span style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px">${inp}</span></div>`;
}).join('');}
function lvcfgCollect(){const cfg={};LV_TYPES.forEach(t=>{const o={on:$('lc-'+t.key+'-on').checked};
  const q=$('lc-'+t.key+'-quota');if(q)o.quota=parseFloat(q.value)||0;
  const h=$('lc-'+t.key+'-hours');if(h)o.hours=parseInt(h.value)||0;
  const cy=$('lc-'+t.key+'-cycle');if(cy)o.cycle=parseInt(cy.value)||0;
  const p=$('lc-'+t.key+'-paid');if(p)o.paid=p.value;cfg[t.key]=o;});return cfg;}
async function loadLeaveConfig(){try{const d=await api('/api/my/leave-config');LV_CFG=d.leave_config||{};lvcfgRender(LV_CFG);renderLeaveDropdown(LV_CFG);}catch(e){$('lvcfg-body').innerHTML='<div class="empty">불러오기 실패</div>';}}
$('lvcfg-save').addEventListener('click',async()=>{const msg=$('lvcfg-msg');try{const cfg=lvcfgCollect();await api('/api/my/leave-config',{method:'POST',body:JSON.stringify({leave_config:cfg})});LV_CFG=cfg;renderLeaveDropdown(cfg);msg.style.color='var(--green)';msg.textContent='저장했습니다. 휴가 신청 목록에 반영됩니다.';}catch(e){msg.style.color='#dc2626';msg.textContent='저장 실패: '+e;}});
function buildLeaveOptions(cfg){const on=k=>cfg[k]&&cfg[k].on;const g=[['연차',[['annual','연차 (종일)'],['half_am','오전 반차'],['half_pm','오후 반차']]]];const sp=[];
  if(on('bd'))sp.push(['bd','BD'+(cfg.bd.hours?` (${cfg.bd.hours}h/${cfg.bd.cycle||2}주)`:'')]);
  if(on('seollal'))sp.push(['seollal',`설날 휴가 (${cfg.seollal.hours||8}h)`]);
  if(on('chuseok'))sp.push(['chuseok',`추석 휴가 (${cfg.chuseok.hours||8}h)`]);
  if(on('family_care')){sp.push(['family_care_paid','가족돌봄(유급)']);sp.push(['family_care_unpaid','가족돌봄(무급)']);}
  if(on('refresh'))sp.push(['refresh','리프레쉬 휴가']);
  if(on('health'))sp.push(['health','건강휴가']);
  if(on('sabbatical'))sp.push(['sabbatical','안식휴가']);
  if(on('health_check')){if((cfg.health_check.hours||8)==8)sp.push(['health_check_full','건강검진 (8h)']);else{sp.push(['health_check_am','건강검진 (오전 4h)']);sp.push(['health_check_pm','건강검진 (오후 4h)']);}}
  if(on('birthday')){if((cfg.birthday.hours||8)==8)sp.push(['birthday_full','생일 (8h)']);else{sp.push(['birthday_am','생일 (오전 4h)']);sp.push(['birthday_pm','생일 (오후 4h)']);}}
  if(sp.length)g.push(['특수 휴가 (연차 미차감)',sp]);return g;}
function renderLeaveDropdown(cfg){const sel=$('lv-kind');if(!sel)return;sel.innerHTML=buildLeaveOptions(cfg).map(([label,opts])=>`<optgroup label="${label}">`+opts.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')+'</optgroup>').join('');}

/* 탭 전환 */
document.querySelector('.tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
  ['cal','rec','sch','lv','lvcfg','ot'].forEach(id=>$('tab-'+id).classList.toggle('hidden',id!==t.dataset.t));
  if(t.dataset.t==='ot')loadOvertime();
  if(t.dataset.t==='lv')loadLeave();
  if(t.dataset.t==='lvcfg')loadLeaveConfig();});
$('recview').addEventListener('click',e=>{const s=e.target.closest('span');if(!s)return;
  document.querySelectorAll('#recview span').forEach(x=>x.classList.remove('on'));s.classList.add('on');
  $('rec-list').classList.toggle('hidden',s.dataset.v!=='list');$('rec-cal').classList.toggle('hidden',s.dataset.v!=='cal');});

boot();
</script>
