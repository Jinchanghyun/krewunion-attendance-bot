services:
  - type: web
    name: krewunion-attendance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.web.admin:api --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true          # 자동 생성
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: krewunion-db
          property: connectionString

databases:
  - name: krewunion-db
    plan: free
